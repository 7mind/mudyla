name: Terminal interfaces

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Require the native Zsh completion shell
        if: runner.os == 'macOS'
        run: command -v zsh
      - name: Test logger interfaces and terminal compatibility
        run: >-
          python -m pytest tests/test_terminal_logger_actions.py tests/test_interactive_terminal.py
          tests/test_stream_loggers.py tests/test_terminal_output.py tests/test_terminal_capture.py tests/test_teamcity_logger.py tests/test_logger_modes.py tests/test_logger_interactions.py tests/test_pure_checklist.py tests/test_pure_dag_actions.py tests/test_terminal_background.py tests/test_plan_dag.py tests/test_detail_formatters.py tests/test_windows_mouse.py tests/test_cli_parser_structure.py tests/test_bash_runtime.py
          tests/test_native_dag.py tests/test_grid_search.py tests/test_graph_scheduling.py tests/test_dag_branch_colors.py tests/test_dag_display_edges.py tests/test_dag_route_clearance.py
          tests/test_pure_status_symbols.py tests/test_status_symbols.py tests/test_plan_status_symbols.py tests/test_python_runtime.py
          tests/test_symbol_console.py tests/test_dag_preparation.py tests/test_solver_timing.py tests/test_pure_empty_logs.py
          tests/test_terminal_logger.py tests/test_retainer_display.py tests/test_retainer_progress.py tests/test_process_ownership.py
          tests/test_screen_ownership.py::test_screen_ownership_follows_session_and_temporary_detail
          tests/test_screen_ownership.py::test_inline_idle_refresh_preserves_history_and_frame_anchor
          tests/test_screen_ownership.py::test_inline_idle_refresh_keeps_scrollback_after_frame_growth_and_crop
          --override-ini addopts=-v -o log_cli=false -o faulthandler_timeout=60 --durations=20
      - name: Check logger types
        run: python -m mypy mudyla/logging/terminal_logger.py mudyla/logging/terminal_logger_simple.py mudyla/logging/terminal_logger_verbose.py mudyla/logging/terminal_logger_github.py mudyla/logging/terminal_logger_teamcity.py mudyla/logging/teamcity.py mudyla/logging/terminal_logger_pure.py mudyla/logging/formatters/symbols.py mudyla/logging/terminal_logger_table.py mudyla/logging/windows_mouse.py mudyla/logging/terminal_output.py mudyla/logging/terminal_background.py mudyla/logging/formatters/details.py mudyla/logging/formatters/plan.py mudyla/logging/formatters/dag.py mudyla/logging/formatters/layered.py mudyla/logging/formatters/output.py mudyla/logging/formatters/sections.py mudyla/logging/formatters/native_dag.py mudyla/dag/solver mudyla/dag/display.py mudyla/logging/formatters/branches.py mudyla/executor/runtime_python.py mudyla/logging/display_session.py mudyla/logging/retainer_display.py mudyla/executor/retainer_executor.py mudyla/executor/process.py mudyla/executor/process_windows.py mudyla/cli_builder.py --follow-imports=silent
